<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manage Reviews — Movix Admin</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
    rel="stylesheet" />
  <style>
    :root {
      --primary: #8b3dff;
      --bg-dark: #0a0a0a;
      --bg-card: #161616;
      --bg-hover: #222222;
      --text-primary: #ffffff;
      --text-secondary: #a3a3a3;
      --border: #262626;
      --radius: 12px;
      --radius-lg: 18px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-dark);
      color: var(--text-primary);
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .page {
      max-width: 1400px;
      margin: 0 auto;
      padding: 28px 24px 40px;
    }

    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 18px 24px;
      margin-bottom: 24px;
      background: rgba(10, 10, 10, .96);
      border: 1px solid rgba(255, 255, 255, .06);
      border-radius: var(--radius-lg);
    }

    .logo {
      font-size: 22px;
      font-weight: 800;
    }

    .logo span {
      color: var(--primary);
    }

    .nav-links {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
    }

    .nav-links a {
      color: var(--text-secondary);
      font-size: 14px;
      font-weight: 600;
    }

    .nav-links a:hover {
      color: var(--text-primary);
    }

    .hero {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 20px;
      align-items: center;
      margin-bottom: 28px;
    }

    .hero h1 {
      font-size: clamp(2.4rem, 3vw, 3.4rem);
      line-height: 1.05;
    }

    .panel {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 28px;
      box-shadow: 0 18px 35px rgba(0, 0, 0, .12);
      position: relative;
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 22px;
    }

    .panel-header h2 {
      margin: 0;
      font-size: 1.35rem;
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 760px;
    }

    th,
    td {
      padding: 16px 14px;
      border-bottom: 1px solid rgba(255, 255, 255, .06);
      text-align: left;
    }

    th {
      color: var(--text-secondary);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .08em;
    }

    td {
      font-size: 14px;
    }

    tr:hover {
      background: rgba(255, 255, 255, .03);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 18px;
      border-radius: 999px;
      transition: .2s ease;
      font-weight: 600;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
    }

    .btn-secondary {
      background: rgba(255, 255, 255, .04);
      color: var(--text-primary);
      border: 1px solid rgba(255, 255, 255, .08);
    }

    .btn-danger {
      background: #f87171;
      color: white;
    }

    .btn:hover {
      transform: translateY(-1px);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(255, 255, 255, .05);
      font-size: 12px;
      font-weight: 700;
    }

    .status-select {
      display: inline-flex;
      width: 100%;
      color: var(--text-primary);
      border: 1px solid rgba(255, 255, 255, .08);
      border-radius: 999px;
      padding: 10px 14px;
      font-size: 14px;
      font-weight: 700;
      background: rgba(255, 255, 255, .04);
      transition: all .2s ease;
      cursor: pointer;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .02);
      -webkit-appearance: none;
      -moz-appearance: none;
      appearance: none;
      -webkit-text-fill-color: var(--text-primary);
    }

    .status-select:hover {
      background: rgba(255, 255, 255, .08);
    }

    .status-select:focus {
      outline: none;
      box-shadow: 0 0 0 2px rgba(139, 61, 255, .22);
      color: var(--text-primary);
      -webkit-text-fill-color: var(--text-primary);
    }

    .status-select option {
      background: var(--bg-card) !important;
      color: var(--text-primary) !important;
    }

    .status-approved {
      background: rgba(52, 211, 153, 0.14);
      border-color: #34d399;
      color: #34d399;
    }

    .status-pending {
      background: rgba(251, 191, 36, 0.14);
      border-color: #fbbf24;
      color: #fbbf24;
    }

    .status-rejected {
      background: rgba(248, 113, 113, 0.14);
      border-color: #f87171;
      color: #f87171;
    }

    .badge.approved {
      color: #34d399;
    }

    .badge.pending {
      color: #fbbf24;
    }

    .badge.rejected {
      color: #f87171;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .55);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 20px;
    }

    .modal-backdrop.active {
      display: flex;
    }

    .modal {
      width: min(560px, 100%);
      background: var(--bg-card);
      border: 1px solid rgba(255, 255, 255, .08);
      border-radius: 24px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, .35);
      padding: 28px;
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 22px;
    }

    .modal-header h3 {
      margin: 0;
      font-size: 1.35rem;
    }

    .modal-close {
      background: transparent;
      border: none;
      color: var(--text-secondary);
      font-size: 1.4rem;
      cursor: pointer;
    }

    .modal-body {
      display: grid;
      gap: 16px;
    }

    .modal-body label {
      font-size: 13px;
      color: var(--text-secondary);
    }

    .modal-body input,
    .modal-body textarea,
    .modal-body select {
      width: 100%;
      background: rgba(255, 255, 255, .04);
      border: 1px solid rgba(255, 255, 255, .08);
      border-radius: 14px;
      padding: 12px 14px;
      color: var(--text-primary);
      font-size: 14px;
    }

    .modal-body textarea {
      resize: vertical;
      min-height: 80px;
    }

    .modal-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 12px;
      margin-top: 18px;
    }

    .moderation-list {
      display: grid;
      gap: 12px;
      max-height: 400px;
      overflow-y: auto;
    }

    .moderation-item {
      background: rgba(255, 255, 255, .04);
      border: 1px solid rgba(255, 255, 255, .08);
      border-radius: 14px;
      padding: 14px;
    }

    .moderation-item-text {
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 10px;
    }

    .moderation-item-actions {
      display: flex;
      gap: 8px;
    }

    .moderation-item-actions button {
      padding: 6px 12px;
      font-size: 12px;
    }

    @media (max-width: 860px) {
      .hero {
        grid-template-columns: 1fr;
      }

      .table-wrap {
        overflow-x: scroll;
      }
    }
  </style>
</head>

<body>
  <div class="page">
    <header class="nav">
      <a class="logo" href="/admin"><span>Mo</span>Vix Admin</a>
      <nav class="nav-links">
        <a href="/admin">Dashboard</a>
        <a href="/manage_users">Users</a>
        <a href="/manage_reviews">Watchlist</a>
        <a href="/manage_reviews">Reviews</a>
      </nav>
    </header>

    <div class="hero">
      <div>
        <h1>Manage Reviews</h1>
        <p>Moderate user feedback, approve high-quality reviews, and remove any content that doesn't fit platform
          guidelines.</p>
      </div>
      <a class="btn btn-primary" href="/admin">Back to Dashboard</a>
    </div>

    <section class="panel">
      <div class="panel-header">
        <h2>Latest Reviews</h2>
        <button class="btn btn-secondary" type="button" onclick="openModerationModal()">Moderation Queue</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>User</th>
              <th>Movie</th>
              <th>Rating</th>
              <th>Review</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="reviewsTable"></tbody>
        </table>
      </div>
    </section>

    <footer style="margin-top: 28px; color: var(--text-secondary); font-size: 13px;">© 2026 Movix Admin</footer>
  </div>
  <script>
    async function loadReviews() {
      const tbody = document.getElementById("reviewsTable");

      try {
        const response = await fetch("/api/admin/reviews");
        const reviews = await response.json();

        tbody.innerHTML = "";

        reviews.forEach(review => {
          tbody.innerHTML += `
                <tr>
                    <td>${review.user_name}</td>
                    <td>${review.movie_title}</td>
                    <td>⭐ ${review.rating}/10</td>
                    <td>${review.review_text}</td>
                    <td>
                        <span class="badge ${review.status.toLowerCase()}">
                            ${review.status}
                        </span>
                    </td>
                    <td>
                        <button class="action-badge edit"
                                onclick="approveReview(${review.id})">
                            Approve
                        </button>

                        <button class="action-badge delete"
                                onclick="deleteReview(${review.id})">
                            Delete
                        </button>
                    </td>
                </tr>
            `;
        });

      } catch (err) {
        console.error(err);
        tbody.innerHTML =
          '<tr><td colspan="6">Failed to load reviews.</td></tr>';
      }
    }

    document.addEventListener("DOMContentLoaded", loadReviews);


    async function approveReview(id) {
      await fetch(`/api/admin/reviews/${id}/approve`, {
        method: "POST"
      });

      loadReviews();
    }

    async function deleteReview(id) {
      if (!confirm("Delete this review?")) return;

      await fetch(`/api/admin/reviews/${id}`, {
        method: "DELETE"
      });

      loadReviews();
    }
  </script>

</body>

</html>
